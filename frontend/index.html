<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Two, because Android paints the status bar this colour and the app
      has two grounds. One fixed value left the bar the wrong colour for
      whichever scheme was not chosen.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f7f3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161611" />
    <meta name="color-scheme" content="light dark" />
    <!-- Private content: must never reach a search engine. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>endpoint</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
